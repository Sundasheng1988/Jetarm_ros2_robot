slam_toolbox:
  ros__parameters:
    use_sim_time: false

    odom_frame: odom_combined
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan

    mode: mapping
    resolution: 0.05

    transform_publish_period: 0.02
    map_update_interval: 2.0
    minimum_travel_distance: 0.10
    minimum_travel_heading: 0.10
