tts_speaker_node:
  ros__parameters:
    emit_mode: "wav"                       # 更稳
    player: "ffplay -autoexit -nodisp -loglevel quiet"
    sentence_silence_ms: 80                # 句间停顿
    max_sentence_len: 220                  # 分句上限
    length_scale: 1.04
    noise_scale: 0.65
    noise_w: 0.90

