# llm_voice_agent/config/wake_words.yaml
/**:
  ros__parameters:
    wake_words:
      - "rebecca"
      - "瑞贝卡"

    # 允许 r e b e c c a 中间有空格
    wake_regex:
      - 'r\s*e\s*b\s*e\s*c\s*c\s*a'
      - '瑞\s*贝\s*卡'

    # strip 时用同样的正则
    strip_patterns:
      - 'r\s*e\s*b\s*e\s*c\s*c\s*a'
      - '瑞\s*贝\s*卡'
